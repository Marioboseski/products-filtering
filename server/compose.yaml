name: products-filtering

services:
  # --------------------------------------------------
  # Backend API
  # --------------------------------------------------
  api:
    build: .
    init: true
    env_file: ./.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./src:/app/src:ro
    command: npm run dev
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # --------------------------------------------------
  # Pocetni podaci
  # --------------------------------------------------
  seed:
    build: .
    init: true
    env_file: ./.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - ./src:/app/src:ro
    command: npm run seed
    depends_on:
      - db
    restart: "no"

  # --------------------------------------------------
  # MySQL baza
  # --------------------------------------------------
  db:
    image: mysql:8.4
    env_file: ./.env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped

volumes:
  mysql_data:
